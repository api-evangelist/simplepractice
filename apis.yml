aid: simplepractice
url: https://raw.githubusercontent.com/api-evangelist/simplepractice/refs/heads/main/apis.yml
name: SimplePractice
kind: company
description: >-
  SimplePractice is a cloud-based practice management platform and EHR for
  behavioral and mental health, therapy, and wellness practices, covering
  scheduling, client management, telehealth, intake and clinical
  documentation, insurance and superbill billing, and a secure client
  portal (Client Secure Messaging). As of this cataloging, SimplePractice
  does NOT publish a public, self-serve developer API - there is no developer
  portal, no documented REST endpoints, no OpenAPI, and no webhooks for third
  parties. The only programmatic surface is the partner-only SimplePractice
  Enterprise scheduling integration, which lets EAPs and Managed Care
  Organizations view in-network provider availability and request
  appointments; it is delivered through customized partnerships rather than
  as public developer documentation. Third-party pages that advertise a
  "stable SimplePractice REST API" for clients, appointments, notes, or
  billing are unofficial and not backed by any SimplePractice developer
  program.
