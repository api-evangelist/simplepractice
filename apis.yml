    type: Documentation
  description: >-
    Partner-only integration announced by SimplePractice Enterprise
    (September 2022) that connects to overlapping SimplePractice provider
    accounts so that Employee Assistance Programs (EAPs), Managed Care
    Organizations (MCOs), members, and care coordinators can filter
    in-network behavioral health providers by location and specialty, view
    real-time availability, and request appointments. NOTE - endpointsModeled -
    no public developer documentation, base URL, authentication scheme,
    OpenAPI definition, or endpoint reference has been published by
    SimplePractice; access is arranged through negotiated enterprise
    partnerships, so no endpoints are asserted or fabricated here.
