description: >-
  FinOps view of SimplePractice spend. SimplePractice bills a per-account
  monthly subscription (Starter, Essential, or Plus) plus per-clinician seat
  charges and per-clinician add-ons (AI Note Taker / Care Aide, ePrescribe),
  layered with usage-based payment card processing (percentage plus per
  transaction), per-claim processing fees, and an annual per-clinician CPT
  licensing fee. This models the cost of running the SimplePractice
  application; it is NOT API consumption cost - SimplePractice publishes no
  public metered developer API. SimplePractice Enterprise partnerships,
  including the partner scheduling integration, are priced by negotiated
  contract.
notes: >-
  Rates reflect the published SimplePractice pricing page; promotional
  discounts (commonly 50% off for the first three months) and processing
  fees change - verify during reconciliation.
