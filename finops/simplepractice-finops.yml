meters:
- name: subscription
  description: Monthly per-account plan charge (Starter $49, Essential $79, Plus $99).
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: clinician_seats
  description: Additional clinician seats (Plus only), tiered $74 / $72 / $69 per clinician per month by count.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - clinician
- name: practice_manager_seats
  description: Practice manager seats billed at $39 per manager per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
- name: ai_note_taker
  description: AI Note Taker add-on at $35 per clinician per month.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - clinician
- name: eprescribe
  description: ePrescribe add-on at $49 per clinician per month plus a one-time $89 per-clinician setup fee.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - clinician
- name: card_processing
  description: Card processing fees at 3.15% plus $0.30 per transaction.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
- name: claim_processing
  description: Insurance claim processing fees from $0.25 per claim.
  unit: claims
  aggregation: sum
  dimensions:
  - account
- name: cpt_licensing
  description: Annual CPT code licensing fee of $20 per clinician per year.
  unit: clinicians
  aggregation: sum
  dimensions:
  - account
  - clinician
principles:
- name: Visibility
  description: Track the monthly subscription, clinician and manager seat counts, and add-on charges against the number of active providers.
- name: Allocation
  description: Map clinician seats and add-ons to individual providers or locations for group practices.
- name: Optimization
  description: Right-size the plan tier, only add AI Note Taker / ePrescribe for clinicians who use them, and factor card and claim processing fees into fee schedules.
- name: Accountability
  description: Assign a practice owner to review the SimplePractice invoice monthly, including seat growth and per-transaction processing costs.
